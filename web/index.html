<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="c_billing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>c_billing</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #F4F7F5;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 36px 28px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 54% 38%, #F7FBF8 0%, #F3F6F4 46%, #E7EEEA 100%);
      font-family: Georgia, "Times New Roman", serif;
      color: #161A18;
      overflow: hidden;
    }

    #splash .rings {
      position: absolute;
      left: 52%;
      top: 46%;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    #splash .rings span {
      position: absolute;
      left: 0;
      top: 0;
      width: 22vmin;
      height: 22vmin;
      border: 1px solid #D5DED8;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: splash-ring 8.4s linear infinite;
    }

    #splash .rings .r2 { animation-delay: -2.8s; }
    #splash .rings .r3 { animation-delay: -5.6s; }

    #splash .stage {
      margin: auto;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 22px;
      text-align: left;
      animation: splash-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    #splash img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow: 0 0 22px rgba(30, 154, 98, 0.28);
      flex: none;
    }

    #splash .copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    #splash h1 {
      margin: 0;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1;
    }

    #splash .tagline {
      margin: 8px 0 0;
      color: #6A756F;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.7px;
      line-height: 1;
    }

    #splash .line {
      width: 220px;
      height: 2.5px;
      margin-top: 14px;
      border-radius: 2px;
      background: #1E9A62;
      transform-origin: left center;
      animation: splash-line 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
    }

    #splash .foot {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      animation: splash-fade 0.55s ease-out 0.4s both;
    }

    #splash .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: #6A756F;
      font-size: 13px;
      font-weight: 500;
    }

    #splash .spin {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.6px solid #6A756F;
      border-top-color: transparent;
      box-sizing: border-box;
      animation: splash-spin 0.8s linear infinite;
      flex: none;
    }

    #splash .version {
      margin: 0;
      color: #6A756F;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    @keyframes splash-rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes splash-line {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    @keyframes splash-fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes splash-ring {
      0% { width: 18vmin; height: 18vmin; opacity: 0; }
      14% { opacity: 1; }
      100% { width: 96vmin; height: 96vmin; opacity: 0; }
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #07110D;
      }

      #splash {
        background:
          radial-gradient(circle at 54% 38%, #173528 0%, #0C1A14 46%, #07110D 100%);
        color: #FFFFFF;
      }

      #splash .rings span {
        border-color: rgba(255, 255, 255, 0.10);
      }

      #splash img {
        box-shadow: 0 0 22px rgba(61, 220, 132, 0.28);
      }

      #splash .tagline,
      #splash .status,
      #splash .version {
        color: #9AA59E;
      }

      #splash .line {
        background: #3DDC84;
      }

      #splash .spin {
        border-color: #9AA59E;
        border-top-color: transparent;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .stage,
      #splash .line,
      #splash .foot,
      #splash .spin,
      #splash .rings span {
        animation: none;
      }
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="splash">
    <div class="rings" aria-hidden="true">
      <span class="r1"></span>
      <span class="r2"></span>
      <span class="r3"></span>
    </div>
    <div class="stage">
      <img src="splash_logo.png" alt="">
      <div class="copy">
        <h1>C-Billing</h1>
        <p class="tagline">THE BACKBONE OF YOUR BUSINESS</p>
        <div class="line"></div>
      </div>
    </div>
    <div class="foot">
      <p class="status"><span class="spin"></span>Loading your workspace...</p>
      <p class="version">Version 1.0.0</p>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
