<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="c_billing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>c_billing</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #F2F5F3;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 38%, #D7F6E8 0%, #EEF6F2 42%, #F2F5F3 100%);
      font-family: Georgia, "Times New Roman", serif;
      color: #10241C;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #070908;
      }

      #splash {
        background:
          radial-gradient(circle at 50% 38%, #1A4034 0%, #0E1C17 42%, #070908 100%);
        color: #F2F5F3;
      }

      #splash .tagline {
        color: #8E9892;
      }
    }

    #splash img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 28px rgba(27, 77, 62, 0.28);
    }

    #splash h1 {
      margin: 28px 0 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1;
    }

    #splash .tagline {
      margin: 16px 0 0;
      color: #5E6B64;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.6px;
      line-height: 1.45;
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="splash">
    <img src="splash_logo.png" alt="">
    <h1>C-Billing</h1>
    <p class="tagline">THE BACKBONE FOR<br>YOUR BUSINESS</p>
  </div>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
