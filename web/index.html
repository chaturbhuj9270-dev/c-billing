<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="c_billing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>c_billing</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #F2F5F3;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 38%, #D7F6E8 0%, #EEF6F2 42%, #F2F5F3 100%);
      font-family: Georgia, "Times New Roman", serif;
      color: #10241C;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #070908;
      }

      #splash {
        background:
          radial-gradient(circle at 50% 38%, #1A4034 0%, #0E1C17 42%, #070908 100%);
        color: #F2F5F3;
      }

    }

    #splash .mark {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #splash .ring {
      position: absolute;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 1.6px solid rgba(27, 77, 62, 0.32);
      animation: splash-ripple 2.8s linear infinite;
    }

    #splash .ring.r2 { animation-delay: -1.87s; }
    #splash .ring.r3 { animation-delay: -0.93s; }

    #splash .logo {
      animation: splash-logo-in 0.7s cubic-bezier(0.34, 1.45, 0.64, 1) both;
    }

    #splash img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow: 0 0 28px rgba(27, 77, 62, 0.28);
      animation: splash-pulse 1.6s ease-in-out 0.7s infinite;
    }

    #splash h1 {
      margin: 28px 0 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1;
      animation: splash-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
    }

    #splash .line {
      width: 42px;
      height: 3px;
      margin-top: 16px;
      border-radius: 2px;
      background: #1B4D3E;
      animation: splash-line 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.68s both;
    }

    #splash .tagline {
      margin: 16px 0 0;
      color: #5E6B64;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.6px;
      line-height: 1.45;
      animation: splash-fade 0.55s ease-out 0.85s both;
    }

    @keyframes splash-ripple {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2.28); opacity: 0; }
    }

    @keyframes splash-logo-in {
      from { opacity: 0; transform: scale(0.55); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    @keyframes splash-rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes splash-line {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    @keyframes splash-fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-color-scheme: dark) {
      #splash .tagline {
        color: #8E9892;
      }

      #splash .ring {
        border-color: rgba(91, 175, 127, 0.55);
      }

      #splash img {
        box-shadow: 0 0 28px rgba(59, 108, 79, 0.45);
      }

      #splash .line {
        background: #5CAF7F;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .ring,
      #splash .logo,
      #splash img,
      #splash h1,
      #splash .line,
      #splash .tagline {
        animation: none;
      }
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="splash">
    <div class="mark">
      <span class="ring r1"></span>
      <span class="ring r2"></span>
      <span class="ring r3"></span>
      <div class="logo">
        <img src="splash_logo.png" alt="">
      </div>
    </div>
    <h1>C-Billing</h1>
    <div class="line"></div>
    <p class="tagline">THE BACKBONE FOR<br>YOUR BUSINESS</p>
  </div>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
