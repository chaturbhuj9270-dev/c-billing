name: c_billing
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1
 
environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.2
  bloc: ^8.1.0
  equatable: ^2.0.5
  get_it: ^8.2.0
  http: ^0.13.6
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.0
  shared_preferences: ^2.2.2
  image_picker: ^0.8.8
  intl: ^0.19.0
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0
  # POS Thermal Printer Support
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  # PDF Generation and Sharing
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4
  share_plus: ^10.0.3
  url_launcher: ^6.3.2
  # Offline-First Database (community maintained with AGP support)
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  # Network Connectivity
  connectivity_plus: ^6.1.4
  # Invoice OCR (Google MLKit)
  google_mlkit_text_recognition: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # Isar Generator (community maintained)
  isar_community_generator: ^3.3.0
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/google.png
    - assets/images/payment_qr.png
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Bold.ttf