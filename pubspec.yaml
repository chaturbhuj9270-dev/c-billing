name: c_billing
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1
 
environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.2
  bloc: ^8.1.0
  equatable: ^2.0.5
  get_it: ^8.2.0
  http: ^1.6.0
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.0
  shared_preferences: ^2.2.2
  image_picker: ^0.8.8
  intl: ^0.19.0
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0
  # POS Thermal Printer Support
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  # PDF Generation and Sharing
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4
  share_plus: ^10.0.3
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  # Google Gemini AI for Invoice Scanning
  google_generative_ai: ^0.4.6
  # Offline-first SQLite database
  drift: ^2.28.1
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.32
  path: ^1.9.1
  # Network Connectivity
  connectivity_plus: ^6.1.4
  font_awesome_flutter: ^11.0.0
  # Barcode Generation
  barcode: ^2.2.8
  barcode_widget: ^2.0.4
  # Barcode Scanning
  mobile_scanner: ^7.1.3
  # Signature Pad
  signature: ^5.4.1
  flutter_cashfree_pg_sdk: 2.4.0+52
  cloud_functions: ^5.6.2
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.28.1
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    - assets/images/google.png
    - assets/images/payment_qr.png
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Bold.ttf