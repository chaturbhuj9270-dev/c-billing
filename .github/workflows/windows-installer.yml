name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - build/windows-installer

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -eq 3010) { exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build C-Billing-Setup.exe
        run: powershell -ExecutionPolicy Bypass -File installer\build_windows_installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: C-Billing-Setup
          path: build/windows/installer/C-Billing-Setup.exe
          if-no-files-found: error
